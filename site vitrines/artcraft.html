<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALCADRE — Bientôt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#060606;
    --white:#F7F7F5;
    --grey-1:#1a1a1a;
    --grey-2:#6a6a68;
    --grey-3:#c4c4c0;
    --line: rgba(247,247,245,0.18);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:var(--black);
    color:var(--white);
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    height:100dvh;
    padding:clamp(12px, 3vh, 24px);
  }

  /* ---------- AnimatedBackground : rubans de lumière (WebGL) ---------- */
  .animated-background{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--black);
  }
  .animated-background canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  .scrim{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background: radial-gradient(ellipse 60% 65% at 50% 50%, rgba(6,6,6,0.72) 0%, rgba(6,6,6,0.45) 40%, rgba(6,6,6,0.05) 70%, rgba(6,6,6,0) 100%);
  }


  .corner-label{
    position:fixed;
    font-size:11px;
    font-weight:500;
    letter-spacing:0.2em;
    color:var(--grey-3);
    text-transform:uppercase;
    z-index:2;
    text-shadow:0 1px 12px rgba(0,0,0,0.8);
  }
  .corner-label.top-left{ top:34px; left:38px; }
  .corner-label.top-right{ top:34px; right:38px; text-align:right; }
  .corner-label.bottom-left{ bottom:34px; left:38px; }
  .corner-label.bottom-right{ bottom:34px; right:38px; text-align:right; }

  /* ---------- Main content ---------- */
  .stage{
    text-shadow:0 2px 18px rgba(0,0,0,0.65);
    width:100%;
    max-width:900px;
    max-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:clamp(14px, 3.2vh, 56px);
    opacity:0;
    position:relative;
    z-index:2;
    animation: riseIn 1s ease forwards 0.6s;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .wordmark{
    width:clamp(120px, 22vh, 300px);
    height:auto;
    max-width:60vw;
  }

  .eyebrow{
    font-size:clamp(9px, 1.4vh, 11px);
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--grey-3);
    margin-top:clamp(8px, 1.8vh, 18px);
  }

  .countdown{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:clamp(6px, min(2.4vh, 2.2vw), 34px);
    max-width:100%;
  }

  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(6px, 1.4vh, 14px);
  }

  .digits{
    font-variant-numeric: tabular-nums;
    font-weight:600;
    font-size:clamp(26px, min(9vh, 10vw), 108px);
    line-height:1;
    letter-spacing:-0.01em;
  }

  .digits .fig{
    display:inline-block;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.35s ease;
  }
  .digits .fig.flip{
    transform: translateY(-6px);
    opacity:0.4;
  }

  .unit .label{
    font-size:clamp(9px, 1.4vh, 11px);
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--grey-3);
  }

  .sep{
    font-size:clamp(16px, min(5vh, 5.5vw), 60px);
    font-weight:300;
    color:var(--grey-2);
    align-self:flex-start;
    padding-top:6px;
  }

  .rule{
    width:1px;
    height:clamp(24px, 5vh, 52px);
    background:var(--line);
  }

  .target-date{
    font-size:clamp(10px, 1.5vh, 12px);
    letter-spacing:0.2em;
    color:var(--grey-3);
    text-transform:uppercase;
  }

  /* ---------- Email capture ---------- */
  .notify{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(8px, 1.6vh, 16px);
  }

  .notify-label{
    font-size:clamp(11px, 1.6vh, 13px);
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--white);
  }

  form.notify-form{
    display:flex;
    align-items:center;
    gap:6px;
    width:min(440px, 86vw);
    padding:6px 6px 6px 22px;
    border-radius:999px;
    background:rgba(247,247,245,0.07);
    border:1px solid rgba(247,247,245,0.22);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 10px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    transition:border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
  }
  form.notify-form:hover{
    border-color:rgba(247,247,245,0.35);
  }
  form.notify-form:focus-within{
    border-color:rgba(247,247,245,0.6);
    background:rgba(247,247,245,0.1);
    box-shadow:0 10px 40px rgba(0,0,0,0.45), 0 0 0 4px rgba(247,247,245,0.08), 0 0 32px rgba(247,247,245,0.12);
  }

  .notify-form input[type="email"]{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:var(--white);
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    letter-spacing:0.02em;
    padding:12px 0;
  }
  .notify-form input[type="email"]::placeholder{
    color:rgba(247,247,245,0.5);
  }

  .notify-form button{
    flex:none;
    background:var(--white);
    border:none;
    border-radius:999px;
    color:var(--black);
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.16em;
    text-transform:uppercase;
    cursor:pointer;
    padding:14px 22px;
    white-space:nowrap;
    text-shadow:none;
    transition:transform 0.25s ease, box-shadow 0.25s ease;
  }
  .notify-form button::after{
    content:"→";
    margin-left:8px;
    display:inline-block;
    transition: transform 0.25s ease;
  }
  .notify-form button:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 24px rgba(247,247,245,0.25);
  }
  .notify-form button:hover::after{
    transform: translateX(4px);
  }
  .notify-form button:focus-visible{
    outline:2px solid var(--white);
    outline-offset:3px;
  }

  .feedback{
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--grey-3);
    min-height:16px;
  }
  .feedback.show{ color:var(--white); }

  @media (prefers-reduced-motion: reduce){
    .stage, .digits .fig{ animation:none !important; transition:none !important; opacity:1 !important; transform:none !important; }
  }

  @media (max-width: 640px){
    .wordmark{ letter-spacing:0.35em; }
    .rule{ height:40px; }
    .corner-label.top-right, .corner-label.bottom-right{ display:none; }
  }
</style>
</head>
<body>

  <!-- AnimatedBackground : rubans de lumière qui ondulent, dessinés en WebGL -->
  <div class="animated-background" id="animated-background" aria-hidden="true">
    <canvas id="bg-canvas"></canvas>
  </div>

  <div class="scrim"></div>

  <div class="corner-label top-left">Artcraft</div>
  <div class="corner-label top-right">Collection 01</div>
  <div class="corner-label bottom-left">Abidjan</div>
  <div class="corner-label bottom-right" id="clock">—</div>

  <main class="stage">
    <div>
      <img class="wordmark" src="alcadre-logo.jpeg" alt="Alcadre">
      <div class="eyebrow">Lancement</div>
    </div>

    <div class="countdown" id="countdown" aria-live="polite">
      <div class="unit">
        <div class="digits" id="d-days">00</div>
        <div class="label">Jours</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="digits" id="d-hours">00</div>
        <div class="label">Heures</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="digits" id="d-minutes">00</div>
        <div class="label">Minutes</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="digits" id="d-seconds">00</div>
        <div class="label">Secondes</div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="target-date">1er août 2027</div>

    <div class="notify">
      <div class="notify-label">Soyez informé au lancement</div>
      <form class="notify-form" id="notify-form">
        <input type="email" id="notify-email" placeholder="votre@email.com" required autocomplete="email">
        <button type="submit">S'inscrire</button>
      </form>
      <div class="feedback" id="notify-feedback"></div>
    </div>
  </main>

  <!-- ============================================================
       Rubans de lumière : 3 rubans flous qui ondulent, avec des
       franges irisées sur les bords (effet prisme).
       Réglages rapides :
         COULEUR = true  -> reflets arc-en-ciel
         COULEUR = false -> noir et blanc
         VITESSE         -> 1 = normal, 2 = deux fois plus rapide
  ============================================================= -->
  <script>
  (function(){
    var COULEUR = false;
    var VITESSE = 1;

    var canvas = document.getElementById('bg-canvas');
    var gl = canvas.getContext('webgl', { antialias:false, alpha:false, premultipliedAlpha:false });
    if (!gl) return; // pas de WebGL : le fond reste noir

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var speed = VITESSE * (reduceMotion ? 0.5 : 1);

    var vert = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';
    var frag = [
      'precision highp float;',
      'uniform vec2 uRes; uniform float uTime; uniform float uMono;',
      'float curve(float x, float t, float k){',
      '  return 0.16*sin(x*1.15 + t*0.31 + k*2.1)',
      '       + 0.08*sin(x*2.3 - t*0.23 + k*4.3)',
      '       + 0.035*sin(x*4.1 + t*0.41 + k*1.7);',
      '}',
      'vec3 spectrum(float x){ return 0.5 + 0.5*cos(6.28318*(x + vec3(0.0, 0.33, 0.67))); }',
      'void main(){',
      '  vec2 uv = gl_FragCoord.xy / uRes;',
      '  float asp = uRes.x / uRes.y;',
      '  vec2 p = vec2((uv.x - 0.5)*asp, uv.y - 0.5);',
      '  float t = uTime;',
      '  vec3 col = vec3(0.0);',
      '  for (int i = 0; i < 3; i++){',
      '    float k = float(i);',
      '    float base = 0.22 - k*0.24 + 0.03*sin(t*0.13 + k);',
      '    float d = p.y - (base + curve(p.x + k*0.7, t*(1.0 + k*0.18), k));',
      '    float w = 0.085 + 0.045*sin(p.x*1.4 + t*0.17 + k*2.0);',
      '    float s = d / w;',
      '    float core = exp(-s*s*0.9);',
      '    float fringe = exp(-pow(abs(s) - 1.25, 2.0)*2.2);',
      '    float halo = exp(-s*s*0.07);',
      '    vec3 tint = spectrum(s*0.22 + k*0.21 + t*0.015 + p.x*0.08);',
      '    float fade = 1.0 - k*0.22;',
      '    col += fade*(core*0.32*vec3(0.62, 0.66, 1.0) + fringe*0.62*tint + halo*0.06*vec3(0.55, 0.5, 0.9));',
      '  }',
      '  float lum = dot(col, vec3(0.299, 0.587, 0.114));',
      '  col = mix(col, vec3(lum)*1.15, uMono);',
      '  col *= 1.0 - 0.75*pow(length(uv - 0.5), 1.6);',
      '  float g = fract(sin(dot(gl_FragCoord.xy + fract(t)*100.0, vec2(12.9898, 78.233)))*43758.5453);',
      '  col += (g - 0.5)*0.02;',
      '  gl_FragColor = vec4(max(col, 0.0), 1.0);',
      '}'
    ].join('\n');

    function shader(type, src){
      var s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
    }
    var vs = shader(gl.VERTEX_SHADER, vert), fs = shader(gl.FRAGMENT_SHADER, frag);
    if (!vs || !fs) return;
    var prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
    gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    var uRes = gl.getUniformLocation(prog, 'uRes');
    var uTime = gl.getUniformLocation(prog, 'uTime');
    gl.uniform1f(gl.getUniformLocation(prog, 'uMono'), COULEUR ? 0 : 1);

    // Le fond est très flou : on le calcule à mi-résolution, c'est plus fluide sur téléphone
    var SCALE = 0.5;
    function resize(){
      canvas.width = Math.max(1, Math.round(window.innerWidth * SCALE));
      canvas.height = Math.max(1, Math.round(window.innerHeight * SCALE));
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uRes, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    var t0 = performance.now();
    function frame(now){
      gl.uniform1f(uTime, 8.0 + (now - t0) / 1000 * speed);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>

<script>
  // ---------- Countdown ----------
  const TARGET = new Date('2027-08-01T00:00:00');

  const els = {
    days: document.getElementById('d-days'),
    hours: document.getElementById('d-hours'),
    minutes: document.getElementById('d-minutes'),
    seconds: document.getElementById('d-seconds'),
  };

  let previous = { days:null, hours:null, minutes:null, seconds:null };

  function pad(n){ return String(n).padStart(2, '0'); }

  function renderUnit(el, value, key){
    const padded = pad(value);
    if(previous[key] !== padded){
      el.textContent = padded;
      el.classList.add('flip');
      requestAnimationFrame(() => {
        setTimeout(() => el.classList.remove('flip'), 350);
      });
      previous[key] = padded;
    }
  }

  function tick(){
    const now = new Date();
    let diff = Math.max(0, TARGET - now);

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    diff -= days * (1000 * 60 * 60 * 24);
    const hours = Math.floor(diff / (1000 * 60 * 60));
    diff -= hours * (1000 * 60 * 60);
    const minutes = Math.floor(diff / (1000 * 60));
    diff -= minutes * (1000 * 60);
    const seconds = Math.floor(diff / 1000);

    renderUnit(els.days, days, 'days');
    renderUnit(els.hours, hours, 'hours');
    renderUnit(els.minutes, minutes, 'minutes');
    renderUnit(els.seconds, seconds, 'seconds');

    const clockEl = document.getElementById('clock');
    if(clockEl){
      clockEl.textContent = now.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    }
  }

  tick();
  setInterval(tick, 1000);

  // ---------- Email capture ----------
  const form = document.getElementById('notify-form');
  const feedback = document.getElementById('notify-feedback');
  const emailInput = document.getElementById('notify-email');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const email = emailInput.value.trim();
    if(!email) return;

    // Stocke localement les inscriptions (à remplacer par un vrai backend / service d'emailing).
    try{
      const list = JSON.parse(localStorage.getItem('alcadre_subscribers') || '[]');
      if(!list.includes(email)){
        list.push(email);
        localStorage.setItem('alcadre_subscribers', JSON.stringify(list));
      }
    }catch(err){ /* stockage indisponible, on ignore silencieusement */ }

    feedback.textContent = 'Merci — vous serez informé au lancement.';
    feedback.classList.add('show');
    emailInput.value = '';
  });
</script>

</body>
</html>
